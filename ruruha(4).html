<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>グッズ譲渡・交換リスト</title>
    <style>
        /* 全体の基本設定 */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            background-color: #ffffff;
            color: #0a0a0a;
            line-height: 1.8;
            padding: 100px 20px 40px;
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #0a0a0a;
            border-bottom: 3px solid #ff4500;
            padding-bottom: 10px;
            display: inline-block;
            margin-bottom: 20px;
        }

        /* 検索バー */
        .search-box {
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        /* グッズカードの配置 */
        .goods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .goods-card {
            background: #fff;
            border: 2px solid #333;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .goods-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }

        .goods-content {
            padding: 15px;
            text-align: left;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .goods-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .goods-type {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            color: #fff;
        }

        .type-譲 { background-color: #ff4500; }
        .type-求 { background-color: #00d2ff; color: #000; }

        .stock-badge {
            font-weight: bold;
            font-size: 0.85rem;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 12px;
            border: 1px solid #ccc;
        }

        .goods-title {
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .goods-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .tag-badge {
            background-color: #f0f4f8;
            color: #0066cc;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        .tag-badge:hover {
            background-color: #0066cc;
            color: #fff;
        }

        /* トップに戻るボタン */
        .back-btn { 
            display: inline-block; 
            margin-top: 40px; 
            padding: 10px 20px; 
            background-color: #00ffff; 
            color: #0a0a0a; 
            text-decoration: none; 
            font-weight: bold;
            border-radius: 5px; 
            transition: 0.3s; 
        }

        .back-btn:hover { 
            background-color: #ff4500; 
            color: #fff; 
        }

        /* ロゴ（画面左上） */
        .logo-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: inline-block;
            text-decoration: none;
            cursor: pointer;
        }

        .logo-img {
            height: 68px;
            width: 135px;
            object-fit: contain;
            display: block;
        }

        /* ハンバーガーメニュー（画面右上） */
        #menu-toggle { display: none; }

        .hamburger-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background-color: #333;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 8px 0;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .hamburger-btn span {
            width: 24px;
            height: 3px;
            background-color: #fff;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .dropdown-menu {
            position: fixed;
            top: 75px;
            right: 20px;
            width: 200px;
            background-color: rgba(30, 30, 30, 0.95);
            border-radius: 12px;
            padding: 15px 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px) scale(0.95);
            transition: all 0.3s ease;
        }

        .dropdown-menu ul { list-style: none; padding: 0; margin: 0; text-align: center; }
        .dropdown-menu li { margin: 10px 0; }
        .dropdown-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            display: block;
            padding: 8px 0;
        }

        #menu-toggle:checked ~ .dropdown-menu { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
        #menu-toggle:checked ~ .hamburger-btn span:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        #menu-toggle:checked ~ .hamburger-btn span:nth-child(2) { opacity: 0; }
        #menu-toggle:checked ~ .hamburger-btn span:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        /* フッター */
        .site-footer {
            background-color: #0d0d0d;
            color: #ffffff;
            padding: 40px 20px 20px;
            margin-top: 60px;
        }

        .footer-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
        .footer-nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; text-align: left; }
        .footer-item { display: flex; flex-direction: column; }
        .footer-item a { color: #ffffff; text-decoration: none; font-size: 1rem; font-weight: bold; }
        .footer-item a::before { content: '⬡'; color: #00ffff; margin-right: 5px; }
        .footer-sub { font-size: 0.75rem; color: #aaaaaa; padding-left: 18px; }
        .footer-bottom { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; padding-top: 20px; flex-wrap: wrap; gap: 15px; }
        .footer-logo { height: 40px; object-fit: contain; }
        .footer-sns { display: flex; gap: 15px; }
        .footer-sns img { width: 28px; height: 28px; filter: brightness(0) invert(1); }
        .copyright { font-size: 0.8rem; color: #888; margin: 0; }
    </style>
</head>
<body>

    <!-- ロゴ -->
    <a href="index.html" class="logo-link">
      <img src="るるはch.png" alt="サイトロゴ" class="logo-img">
    </a>

    <!-- ハンバーガーメニュー -->
    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="hamburger-btn">
      <span></span>
      <span></span>
      <span></span>
    </label>

    <nav class="dropdown-menu">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="ruruha(3).html">詳しい自己紹介</a></li>
        <li><a href="ruruha(1).html">趣味ページ</a></li>
        <li><a href="ruruha(2).html">推しの紹介</a></li>
        <li><a href="ruruha(4).html">グッズ管理</a></li>
        <li><a href="https://twitter.com/S_H_1006neo" target="_blank">Twitter (X)</a></li>
        <li><a href="https://youtube.com/channel/UC90rEN2i0jCUwfDl-g_GmFQ?app=desktop" target="_blank">YouTube</a></li>  
      </ul>
    </nav>

    <!-- メインコンテンツ -->
    <h1>グッズ譲渡・交換リスト</h1>

    <!-- 検索バー -->
    <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 タグやグッズ名でリアルタイム検索...">
    </div>

    <!-- グッズ一覧表示 -->
    <div class="goods-grid" id="goods-container"></div>

    <a href="index.html" class="back-btn">← トップページに戻る</a>

    <!-- フッター -->
    <footer class="site-footer">
        <div class="footer-container">
            <nav class="footer-nav">
                <div class="footer-item"><a href="index.html">HOME</a><span class="footer-sub">ホーム</span></div>
                <div class="footer-item"><a href="ruruha(3).html">PROFILE</a><span class="footer-sub">詳しい自己紹介</span></div>
                <div class="footer-item"><a href="ruruha(1).html">HOBBY</a><span class="footer-sub">趣味ページ</span></div>
                <div class="footer-item"><a href="ruruha(2).html">FAVORITE</a><span class="footer-sub">推しの紹介</span></div>
                <div class="footer-item"><a href="ruruha(4).html">EXCHANGE</a><span class="footer-sub">グッズ交換</span></div>
            </nav>
            <div class="footer-bottom">
                <img src="るるはch.png" alt="るるはch" class="footer-logo">
                <div class="footer-sns">
                    <a href="https://twitter.com/S_H_1006neo" target="_blank"><img src="X.png" alt="Twitter"></a>
                    <a href="https://youtube.com/channel/UC90rEN2i0jCUwfDl-g_GmFQ?app=desktop" target="_blank"><img src="youtube.png" alt="YouTube"></a>
                </div>
                <p class="copyright">&copy; ruruha All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // ★表示するグッズリスト★
        // 今後グッズを追加したい場合は、以下のようにオブジェクトを追加してください。
        // 例: { id: 1, type: "譲", title: "グッズ名", tags: ["タグ1", "タグ2"], stock: 1, image: "画像URL" }
        const goodsList = [];

        const container = document.getElementById('goods-container');
        const searchInput = document.getElementById('search-input');

        // 描画処理
        function renderGoods(filterText = '') {
            container.innerHTML = '';

            const filteredList = goodsList.filter(item => {
                if (item.stock <= 0) return false;

                const text = filterText.toLowerCase();
                const matchTitle = item.title.toLowerCase().includes(text);
                const matchType = item.type.toLowerCase().includes(text);
                const matchTags = item.tags.some(tag => tag.toLowerCase().includes(text));
                return matchTitle || matchType || matchTags;
            });

            if (filteredList.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; color:#888;">現在表示できるグッズはありません。</p>';
                return;
            }

            filteredList.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'goods-card';

                const tagsHtml = item.tags.map(tag => `<span class="tag-badge" onclick="clickTag('${tag}')">#${tag}</span>`).join('');

                card.innerHTML = `
                    <img src="${item.image || 'https://via.placeholder.com/200?text=No+Image'}" class="goods-img" alt="${item.title}">
                    <div class="goods-content">
                        <div>
                            <div class="goods-header">
                                <span class="goods-type type-${item.type}">${item.type}</span>
                                <span class="stock-badge">残り ${item.stock} 個</span>
                            </div>
                            <div class="goods-title">${item.title}</div>
                            <div class="goods-tags">${tagsHtml}</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function clickTag(tagName) {
            searchInput.value = tagName;
            renderGoods(tagName);
        }

        searchInput.addEventListener('input', function(e) {
            renderGoods(e.target.value);
        });

        // 初期描画
        renderGoods();
    </script>
</body>
</html>
